<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDOList</title>
</head>
<body>
 <div class="contentHolder">
    <div class="headerHolder">
        <div class="header"><div class="pickAProject"><p class="pickAProjectText">Creat A Task</p><img src="/src/images/8679858_arrow_drop_down_fill_icon.svg" alt="Drop Down Icon" class="dropDownArrowIcon"></div></div>
        <div class="pickAProjectDropDown hidden">wrap</div>
    </div>
    <div class="SideBarHolder">
     <div class="SideBar flex">
        <h2>Your Projects</h2>
        <div class="CreatAProjectSideBar flex"><div class=""></div><p class="CreatAProjectSideBarText">Creat A Project</p><img src="/src/images/211688_forward_arrow_icon.svg" alt="start project icon" class="dropDownArrowIcon"></div>
     </div>   
    </div> 
    <div class="bodyHolder">
        <div class="projectBuilder hidden">
            <div class="projectBuilderForm flex">
                <form name="projectBuilder" class="tempname" id="ProjectBuilder" action="" method="post">
                <img id="formClose"  src="images/4115230-cancel-close-cross-delete_114048.svg" alt="closesign">
                 <div class="flex inputdiv">
                     <label for="Name">Project Name</label>
                     <input type="text" name="Name" id="Name" required>
                 </div>
                 <div class="flex inputdiv">
                     <label for="dueDate">Project Dueby?</label>
                     <input type="date" name="dueDate" id="dueDate" required >
                 </div>
                 <div class="flex inputdiv">
                     <label for="projectDescription"> Project Description</label>
                     <input type="text" name="projectDescription" id="projectDescription">
                 </div>
                 <button type="submit">Creat Project</button>
                </form>
            </div>
        </div>
    </div>
 </div>   
</body>
</html>
